services:
  bridge:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${BRIDGE_BIND_IP:-0.0.0.0}:${BRIDGE_PORT:-8787}:8787"
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      HONGGUOTV_DEVICE_FILE: /state/device.json
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - "${HONGGUOTV_STATE_DIR:-./.state}:/state"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
